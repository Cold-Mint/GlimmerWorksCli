# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.3'
      - name: Build for Linux
        run: go build -v -o glimmerWorksCli .
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: glimmerWorksCli-linux
          path: glimmerWorksCli

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.3'
      - name: Build for Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -v -o glimmerWorksCli.exe .
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: glimmerWorksCli-windows-amd64
          path: glimmerWorksCli.exe

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
     contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: glimmerWorksCli-linux
          path: ./artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: glimmerWorksCli-windows-amd64
          path: ./artifacts/windows

      - name: Rename files with tag name
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mv ./artifacts/linux/glimmerWorksCli "glimmerWorksCli-linux-${TAG}"
          mv ./artifacts/windows/glimmerWorksCli.exe "glimmerWorksCli-windows-amd64-${TAG}.exe"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            glimmerWorksCli-linux-*
            glimmerWorksCli-windows-amd64-*
          generate_release_notes: true
